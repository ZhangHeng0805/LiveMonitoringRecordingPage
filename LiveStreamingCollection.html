<style>
:root{
  --primary:#6366f1; --primary-2:#818cf8; --primary-soft:#eef0ff;
  --accent:#ec4899; --text:#1f2330; --text-2:#5b6172; --text-3:#8b91a1;
  --line:#e9ebf2; --bg:#f4f5f9; --card:#fff;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.page{max-width:1180px;margin:0 auto;padding:22px 18px 44px}
/* 关键：class 里写了 display:flex/none 的元素会盖掉浏览器默认的 [hidden]{display:none} */
[hidden]{display:none!important}

.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:inline-block;padding:2px 10px;border-radius:999px;background:linear-gradient(90deg,#6366f1,#ec4899);
 color:#fff;font-size:12px;letter-spacing:.5px}
h1{margin:10px 0 6px;font-size:26px;letter-spacing:.3px}
.sub{margin:0;color:var(--text-2);font-size:13px}
.sub b{color:var(--primary);font-weight:600}
.hd-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text-3);font-size:12px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.status.ok .dot{background:#22c1a4}
.status.err .dot{background:#ef4444}
.status.load .dot{background:var(--primary)}
.btn{height:30px;padding:0 12px;border-radius:8px;border:1px solid #dfe2ec;background:#fff;color:var(--text);
 font-size:12.5px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn[disabled]{opacity:.5;cursor:default}
.banner{margin:0 0 14px;padding:10px 14px;border:1px solid #f6d5d5;background:#fef2f2;color:#b42318;
 border-radius:10px;font-size:13px;line-height:1.7}
.banner[hidden]{display:none}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:22px;line-height:1.25;font-weight:650}
.kpi b i{font-size:13px;font-weight:500;font-style:normal;color:var(--text-3);margin-left:2px}
.kpi span{font-size:12px;color:var(--text-2)}
.kpi.accent b{color:var(--primary)}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-bottom:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.vbars{display:flex;align-items:flex-end;gap:4px;height:128px;padding:0 2px}
.vbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.vbars .col .bar{width:100%;max-width:22px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--primary-2),var(--primary));min-height:3px}
.vbars .col .v{font-size:10px;color:var(--text-2);font-variant-numeric:tabular-nums;height:12px;line-height:12px}
.vbars .col .cap{font-size:10px;color:var(--text-3);white-space:nowrap;height:12px;line-height:12px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:8px;font-size:12px}
.hbar .lbl{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{display:block;height:8px;border-radius:5px;background:#f0f1f6;overflow:hidden}
.hbar .fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .3s}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums}

.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
 padding:10px 0 12px;margin-bottom:8px;background:linear-gradient(180deg,var(--bg) 82%,rgba(244,245,249,0))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid #dfe2ec;background:#fff;color:var(--text-2);
 font-size:12.5px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .n{opacity:.75;font-size:11px;margin-left:3px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{height:32px;width:230px;border:1px solid #dfe2ec;border-radius:8px;background:#fff;
 padding:0 30px;font-size:13px;color:var(--text);outline:none}
.search input:focus{border-color:var(--primary)}
.search .ico{position:absolute;left:10px;top:7px;color:#a3a9b8;font-size:13px}
.search .clr{position:absolute;right:8px;top:6px;width:18px;height:18px;line-height:18px;text-align:center;
 border-radius:50%;color:#a3a9b8;cursor:pointer;font-size:13px;display:none}
.search.has .clr{display:block}
select{height:32px;border:1px solid #dfe2ec;border-radius:8px;background:#fff;padding:0 8px;font-size:12.5px;color:var(--text);outline:none}
select:focus{border-color:var(--primary)}
.result{font-size:12px;color:var(--text-3);white-space:nowrap}

.list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.item{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;
 overflow:hidden;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s,border-color .18s}
.item:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(35,40,80,.10);border-color:#d8dbf0}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#eef0ff,#fbe8f3);overflow:hidden}
.thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.thumb .fallback{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
 font-size:20px;color:#b9bede;letter-spacing:1px;text-align:center;padding:0 12px}
.no{position:absolute;z-index:2;left:8px;top:8px;padding:1px 7px;border-radius:6px;background:rgba(31,35,48,.72);color:#fff;
 font-size:11px;font-variant-numeric:tabular-nums}
.year{position:absolute;z-index:2;left:8px;bottom:8px;padding:1px 7px;border-radius:6px;background:rgba(99,102,241,.88);color:#fff;font-size:11px}
.dur{position:absolute;z-index:2;right:8px;bottom:8px;padding:1px 7px;border-radius:6px;background:rgba(31,35,48,.78);color:#fff;
 font-size:11px;font-variant-numeric:tabular-nums}
.play{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s}
.play i{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--primary);
 display:flex;align-items:center;justify-content:center;font-size:16px;font-style:normal;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.item:hover .play{opacity:1}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{margin:0;font-size:13.5px;font-weight:600;line-height:1.45;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3)}
.m .d{font-variant-numeric:tabular-nums;color:var(--text-2)}
.tag{padding:0 6px;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-size:11px}
.tag.pink{background:#fdeef5;color:#c2418a}
.tag.gray{background:#f2f3f8;color:var(--text-2)}
.empty{padding:50px 0;text-align:center;color:var(--text-3);font-size:13px}
.empty b{display:block;font-size:16px;color:var(--text-2);margin-bottom:6px}
.more{display:flex;justify-content:center;margin:18px 0 4px}
.more .btn{height:34px;padding:0 22px;border-radius:999px}
.endnote{margin:20px 0 4px;text-align:center;font-size:12px;color:var(--text-3)}
.endnote::before,.endnote::after{content:"";display:inline-block;width:34px;height:1px;background:#dcdfeb;
 vertical-align:middle;margin:0 10px}
.endnote b{color:var(--text-2);font-weight:600}
.ft{margin-top:26px;text-align:center;color:var(--text-3);font-size:12px}
@media (max-width:1080px){
 .list{grid-template-columns:repeat(3,minmax(0,1fr))}
 .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
 .grid2{grid-template-columns:1fr}
}
@media (max-width:820px){
 .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tools{margin-left:0;width:100%}
 .search{flex:1;min-width:150px}
 .search input{width:100%}
 h1{font-size:22px}
 .page{padding:16px 12px 32px}
 .hbar{grid-template-columns:84px 1fr 48px}
}
</style>

<body>
<div class="page">
  <header class="hd">
    <div>
      <span class="brand">小兰花 × 兰小美</span>
      <h1>直播录屏合集</h1>
      <p class="sub" id="subline">正在加载数据…</p>
    </div>
    <div class="hd-right">
      <span class="pill" id="srcPill">数据源：3 个 JSON 接口</span>
      <span class="pill" id="updPill">—</span>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">加载中</span></span>
      <button class="btn" id="btnReload">刷新</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <h2><i class="dot"></i>各月录屏期数</h2>
      <div class="vbars" id="monthBars"></div>
    </div>
    <div class="card">
      <h2><i class="dot"></i>时长排行 Top 5</h2>
      <div class="hbars" id="durTop"></div>
    </div>
  </section>

  <div class="toolbar">
    <div class="chips" id="yearChips"></div>
    <div class="tools">
      <span class="result" id="result"></span>
      <label class="search" id="searchBox">
        <span class="ico">🔍</span>
        <input id="q" type="search" placeholder="搜索标题 / 日期 / 标签">
        <span class="clr" id="clr">×</span>
      </label>
      <select id="month"><option value="all">全部月份</option></select>
      <select id="sort">
        <option value="desc">最新在前</option>
        <option value="asc">最早在前</option>
        <option value="long">时长最长</option>
        <option value="short">时长最短</option>
      </select>
    </div>
  </div>

  <main class="list" id="list"></main>
  <div class="empty" id="empty" hidden><b>没有匹配的录屏</b>换个关键词或筛选条件试试</div>
  <div class="more" id="moreWrap" hidden><button class="btn" id="btnMore">加载更多</button></div>
  <div class="endnote" id="endNote" hidden>已显示全部 <b id="endCount">0</b> 期</div>

  <div class="ft">点击卡片跳转至 B 站观看 · 数据通过前端配置的 JSON 地址实时拉取</div>
</div>

<script>
getMainUrl();
/* ============================================================
 * 数据源：在这里按年份追加 JSON 地址即可，页面会并行拉取后合并
 * （支持 http(s):// 绝对地址，也支持与页面同目录的相对路径）
 * ============================================================ */
const SOURCES = [
  { label: '2024', url: 'json/2024小兰花直播录屏.json' },
  { label: '2025', url: 'json/2025小兰花直播录屏.json' },
  { label: '2026', url: 'json/2026小兰花直播录屏.json' }
];

const PAGE_SIZE = 60;

/* ---------- 工具 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad = n => (n < 10 ? '0' + n : '' + n);
const WD = ['周日','周一','周二','周三','周四','周五','周六'];

function toSec(d) {
  const p = String(d || '').split(':').map(Number);
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  return 0;
}
function hm(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (h && m) return `${h} 小时 ${m} 分`;
  if (h) return `${h} 小时`;
  return `${m} 分`;
}
const weekday = ds => WD[new Date(ds + 'T00:00:00').getDay()] || '';
/* 少数记录的 date 字段是脏数据（爬取时串进了标题），从 date / title 里都捞一次日期 */
function normDate(d, title) {
  const m = String(d || '').match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  const t = String(title || '').match(/(\d{4})-(\d{2})-(\d{2})/);
  return t ? t[0] : '';
}

/* ---------- 标题 / 标签整理 ---------- */
/* 标题一律用 JSON 里的原始 title，不做任何截取或改写；主题信息交给下面的标签 */
function tidy(title, date) {
  const raw = String(title || '').replace(/\s+/g, ' ').trim();
  const duo = /小兰花\s*\+\s*兰小美/.test(raw);

  const tags = [];
  if (duo) tags.push('联播');
  else if (/兰小美直播录屏/.test(raw)) tags.push('兰小美');
  if (/纯享版/.test(raw)) tags.push('纯享版');
  if (/游戏|三角洲|王者/.test(raw)) tags.push('游戏');
  if (/抖音/.test(raw)) tags.push('抖音');
  if (/B站/.test(raw)) tags.push('B站');
  if (/凌晨/.test(raw)) tags.push('凌晨场');
  if (/晚上/.test(raw)) tags.push('晚间场');
  if (/小兰草/.test(raw)) tags.push('小兰草');
  return { title: raw || date, tags: tags };
}

/* ---------- 数据加载 ---------- */
let BASE = [];
let shown = PAGE_SIZE;
let curYear = 'all', curMonth = 'all', curSort = 'desc', kw = '';
const monthOpts = [];

function setStatus(kind, text) {
  $('#status').className = 'status ' + kind;
  $('#statusText').textContent = text;
}
function setBanner(msg) {
  const b = $('#banner');
  b.textContent = msg || '';
  b.hidden = !msg;
}

async function fetchSource(src) {
  const res = await fetch(src.url, { cache: 'no-store', mode: 'cors' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!Array.isArray(json)) throw new Error('返回格式不是数组');
  return json.map(item => Object.assign({ __src: src.label }, item));
}

async function load() {
  $('#btnReload').disabled = true;
  setBanner('');
  setStatus('load', '正在拉取 ' + SOURCES.length + ' 个 JSON…');
  $('#list').innerHTML = '';
  $('#kpis').innerHTML = '';
  $('#monthBars').innerHTML = '';
  $('#durTop').innerHTML = '';

  const settled = await Promise.allSettled(SOURCES.map(fetchSource));
  const rows = [];
  const failed = [];
  settled.forEach((r, i) => {
    if (r.status === 'fulfilled') rows.push(...r.value);
    else failed.push(SOURCES[i].label + '（' + (r.reason && r.reason.message || '失败') + '）');
  });

  if (failed.length) {
    setBanner('以下数据源拉取失败：' + failed.join('；') +
      '。已展示成功加载的部分。若浏览器拦截了跨域请求，请把页面放到允许 CORS 的环境打开，或把 JSON 与页面放在同一目录后改写 SOURCES。');
  }

  // 去重（同一视频可能在多个年份文件里出现）
  const seen = new Set();
  BASE = rows.filter(r => {
    const key = r.url || (r.date + '|' + r.title);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).map(r => {
    const date = normDate(r.date, r.title);
    const { title, tags } = tidy(r.title, date);
    return {
      date: date, url: r.url, cover: r.cover,
      duration: r.duration, sec: toSec(r.duration),
      year: date.slice(0, 4),
      month: date.slice(0, 7),
      title, tags, src: r.__src
    };
  }).filter(r => r.date)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.duration < b.duration ? -1 : 1)));

  BASE.forEach((r, i) => { r.no = i + 1; });

  if (!BASE.length) {
    setStatus('err', '没有拿到任何数据');
    $('#subline').textContent = '数据为空，请检查 SOURCES 中的 JSON 地址';
    $('#moreWrap').hidden = true;
    $('#empty').hidden = false;
    $('#btnReload').disabled = false;
    return;
  }

  setStatus('ok', '已加载 ' + BASE.length + ' 期 · ' + SOURCES.length + ' 个 JSON');
  $('#srcPill').textContent = '数据源：' + SOURCES.length + ' 个 JSON 接口';
  buildHeader();
  buildCharts();
  buildFilters();
  shown = PAGE_SIZE;
  render();
  $('#btnReload').disabled = false;
}

/* ---------- 头部 / KPI ---------- */
function buildHeader() {
  const first = BASE[0].date, last = BASE[BASE.length - 1].date;
  const totalSec = BASE.reduce((s, r) => s + r.sec, 0);
  const months = [...new Set(BASE.map(r => r.month))].sort();
  const yrs = [...new Set(BASE.map(r => r.year))].sort();
  const daySpan = Math.round((new Date(last) - new Date(first)) / 86400000) + 1;

  $('#subline').innerHTML =
    `共 <b>${BASE.length}</b> 期 · 累计 <b>${(totalSec / 3600).toFixed(1)}</b> 小时 · ` +
    `${yrs[0]} ~ ${yrs[yrs.length - 1]} · ${first} ~ ${last}`;

  const d = new Date(last + 'T00:00:00');
  const days = Math.floor((new Date() - d) / 86400000);
  $('#updPill').textContent = '更新至 ' + last + (days <= 0 ? '（今天）' : `（${days} 天前）`);

  const longest = BASE.reduce((a, b) => (b.sec > a.sec ? b : a), BASE[0]);
  const kpis = [
    ['收录期数', BASE.length, '期', `${daySpan} 天跨度内`],
    ['累计时长', (totalSec / 3600).toFixed(1), '小时', `≈ ${(totalSec / 86400).toFixed(1)} 天连播`],
    ['平均每期', hm(Math.round(totalSec / BASE.length)), '', '按时长均值'],
    ['单期最长', longest.duration, '', `${longest.date} · ${weekday(longest.date)}`],
    ['覆盖月份', months.length, '个月', `${yrs.join(' / ')} 年`],
  ];
  $('#kpis').innerHTML = kpis.map((k, i) =>
    `<div class="kpi${i === 1 ? ' accent' : ''}"><b>${k[1]}${k[2] ? `<i>${k[2]}</i>` : ''}</b><span>${k[0]} · ${k[3]}</span></div>`
  ).join('');
}

/* ---------- 图表 ---------- */
function buildCharts() {
  const ms = [...new Set(BASE.map(r => r.month))].sort();
  const counts = ms.map(m => ({ m, n: BASE.filter(r => r.month === m).length }));
  const max = Math.max(...counts.map(c => c.n), 1);
  $('#monthBars').innerHTML = counts.map((c, i) => `
    <div class="col" title="${c.m}　${c.n} 期">
      <div class="v">${c.n >= max * .5 ? c.n : ''}</div>
      <div class="bar" style="height:${Math.max(3, c.n / max * 88)}px"></div>
      <div class="cap">${i % 4 === 0 ? (+c.m.slice(5)) + '月' : ''}</div>
    </div>`).join('');

  const top = [...BASE].sort((a, b) => b.sec - a.sec).slice(0, 5);
  const tmax = top[0].sec || 1;
  $('#durTop').innerHTML = top.map(r => `
    <div class="hbar" title="${r.date} ${esc(r.title)}　${r.duration}">
      <span class="lbl">${r.date.slice(2)} ${weekday(r.date)}</span>
      <span class="track"><span class="fill" style="width:${(r.sec / tmax * 100).toFixed(1)}%"></span></span>
      <span class="num">${r.duration}</span>
    </div>`).join('');
}

/* ---------- 筛选控件 ---------- */
function buildFilters() {
  const yrs = [...new Set(BASE.map(r => r.year))].sort();
  $('#yearChips').innerHTML = [['all', '全部', BASE.length]].concat(
    yrs.map(y => [y, y + ' 年', BASE.filter(r => r.year === y).length])
  ).map(([v, label, n]) =>
    `<button class="chip${v === 'all' ? ' on' : ''}" data-y="${v}">${label}<span class="n">${n}</span></button>`
  ).join('');

  const ms = [...new Set(BASE.map(r => r.month))].sort();
  $('#month').innerHTML = '<option value="all">全部月份</option>' +
    ms.map(m => `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`).join('');
  $('#month').value = 'all';
}

$('#yearChips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  curYear = b.dataset.y;
  [...$('#yearChips').children].forEach(c => c.classList.toggle('on', c === b));
  shown = PAGE_SIZE;
  render();
});
$('#month').addEventListener('change', e => { curMonth = e.target.value; shown = PAGE_SIZE; render(); });
$('#sort').addEventListener('change', e => { curSort = e.target.value; shown = PAGE_SIZE; render(); });
$('#q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  $('#searchBox').classList.toggle('has', !!kw);
  shown = PAGE_SIZE;
  render();
});
$('#clr').addEventListener('click', () => {
  $('#q').value = ''; kw = '';
  $('#searchBox').classList.remove('has');
  shown = PAGE_SIZE;
  render();
  $('#q').focus();
});
$('#btnReload').addEventListener('click', load);
$('#btnMore').addEventListener('click', () => { shown += PAGE_SIZE; render(); });

/* ---------- 列表 ---------- */
function currentRows() {
  let rows = BASE.filter(r => {
    if (curYear !== 'all' && r.year !== curYear) return false;
    if (curMonth !== 'all' && r.month !== curMonth) return false;
    if (!kw) return true;
    return [r.title, r.date, r.duration, r.tags.join(' '), r.year]
      .join(' ').toLowerCase().includes(kw);
  });
  if (curSort === 'desc') rows.sort((a, b) => b.no - a.no);
  else if (curSort === 'asc') rows.sort((a, b) => a.no - b.no);
  else if (curSort === 'long') rows.sort((a, b) => b.sec - a.sec);
  else rows.sort((a, b) => a.sec - b.sec);
  return rows;
}

function render() {
  const rows = currentRows();
  const slice = rows.slice(0, shown);
  $('#result').textContent = `显示 ${slice.length} / ${rows.length} 期`;
  $('#empty').hidden = rows.length > 0;
  $('#list').innerHTML = slice.map(r => {
    const tagHtml = r.tags.slice(0, 2).map(t => {
      const cls = t === '游戏' ? 'tag pink' : (t === '联播' || t === '纯享版' ? 'tag' : 'tag gray');
      return `<span class="${cls}">${esc(t)}</span>`;
    }).join('');
    return `<a class="item" href="${esc(r.url)}" target="_blank" rel="noopener"
              title="${esc(r.title)}　${r.duration}">
      <div class="thumb">
        <div class="fallback">${esc(r.title.slice(0, 6))}</div>
        <img loading="lazy" src="${esc(r.cover)}" alt="${esc(r.title)}" onerror="this.style.display='none'">
        <span class="no">#${pad(r.no)}</span>
        <span class="year">${esc(r.year)}</span>
        <span class="dur">${esc(r.duration)}</span>
        <span class="play"><i>▶</i></span>
      </div>
      <div class="body">
        <p class="t">${esc(r.title)}</p>
        <div class="m"><span class="d">${r.date.slice(5)} · ${weekday(r.date)}</span>
          <span class="d">${hm(r.sec)}</span>${tagHtml}</div>
      </div>
    </a>`;
  }).join('');
  const more = rows.length > shown;
  $('#moreWrap').hidden = !more;
  $('#endNote').hidden = more || !rows.length;
  $('#endCount').textContent = rows.length;
  if (more) $('#btnMore').textContent = `加载更多（还有 ${rows.length - shown} 期）`;
}

load();
</script>
</body>
</html>
